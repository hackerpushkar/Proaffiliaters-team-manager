# ============================================================================
# HEADER BLOCK: deploy/nginx.conf — Production Nginx Reverse Proxy Configuration
# ============================================================================
# WHAT THIS FILE DOES:
# Routes external HTTPS traffic from manage.proaffiliaters.com to the internal
# Next.js Node daemon running on 127.0.0.1:3050.
# Enables Gzip compression, WebSocket upgrades, and SSL security headers.
# ============================================================================

upstream nextjs_manage_proaffiliaters {
    server 127.0.0.1:3050;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name manage.proaffiliaters.com;

    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manage.proaffiliaters.com;

    # SSL Certificate Paths (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/manage.proaffiliaters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manage.proaffiliaters.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Client Max Body Size for backups/uploads
    client_max_body_size 25M;

    # Next.js Static Asset Caching
    location /_next/static {
        proxy_pass http://nextjs_manage_proaffiliaters;
        proxy_cache_valid 200 365d;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Brand Assets
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://nextjs_manage_proaffiliaters;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Main Application Proxy
    location / {
        proxy_pass http://nextjs_manage_proaffiliaters;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# ============================================================================
# FOOTER BLOCK: deploy/nginx.conf Implementation Notes
# ============================================================================
# - Installation Path: /etc/nginx/sites-available/manage.proaffiliaters.com
# - Symlink: ln -s /etc/nginx/sites-available/manage.proaffiliaters.com /etc/nginx/sites-enabled/
# - Test & Reload: sudo nginx -t && sudo systemctl reload nginx
# ============================================================================
